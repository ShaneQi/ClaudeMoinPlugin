[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moinmoin-mcp"
version = "0.1.0"
description = "Remote MCP server for MoinMoin 1.9 wikis over XML-RPC v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
moinmoin-mcp = "moinmoin_mcp.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
