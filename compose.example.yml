services:
  moinmoin-mcp:
    image: ghcr.io/shaneqi/moinmoinmcp:latest
    build: .
    container_name: moinmoin-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
